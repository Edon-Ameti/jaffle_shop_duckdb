name: CI
jobs:
  - name: build
    steps:
      - name: Compile and build models
        plugin: dbt@v1
        command: dbt build
      - name: Generate docs
        plugin: dbt@v1
        command: dbt docs generate
  - name: teardown
    steps:
      - name: Tear down environment
        plugin: command@v1
        command: echo "TEARDOWN"
    type: cleanup
