name: CI
jobs:
  - name: build
    steps:
      - name: dbt seed
        plugin: dbt@v1
        command: dbt seed
      - name: dbt run
        plugin: dbt@v1
        command: dbt run
      - name: dbt test
        plugin: dbt@v1
        command: dbt test
  - name: teardown
    steps:
      - name: Run teardown
        plugin: command@v1
        command: echo "TEARDOWN"
    type: cleanup