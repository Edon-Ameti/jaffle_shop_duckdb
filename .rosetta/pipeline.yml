name: CI
jobs:
  - name: run-dbt-command
    steps:
      - name: dbt build
        plugin: dbt@v1
        command: dbt build
      - name: dbt seed
        plugin: dbt@v1
        command: dbt seed
  - name: teardown
    steps:
      - name: Run teardown
        plugin: command@v1
        command: echo "TEARDOWN"
    type: cleanup
